<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Campus Cafeteria Food Ordering</title>
</head>
<body>
    <h2>Campus Cafeteria Food Ordering Form</h2>
    <form action="#" method="POST">
        <label for="cust_name">Customer Name:</label><br>
        <input type="text" id="cust_name" name="cust_name" required><br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" required><br><br>

        <label for="food">Food Choice:</label><br>
        <select id="food" name="food" required>
            <option value="">--Select Food Choice--</option>
            <option value="Fried Rice">Fried Rice</option>
            <option value="Chicken Rice">Chicken Rice</option>
            <option value="Burger">Burger</option>
            <option value="Noodles">Noodles</option>
        </select><br><br>

        <label for="quantity">Quantity (1 - 10):</label><br>
        <input type="number" id="quantity" name="quantity" min="1" max="10" required><br><br>

        <label for="collection_time">Collection Time:</label><br>
        <input type="time" id="collection_time" name="collection_time" required><br><br>

        <label for="instructions">Special Instructions / Food Preferences:</label><br>
        <textarea id="instructions" name="instructions" rows="4" cols="40"></textarea><br><br>

        <button type="submit">Place Order</button>
        <button type="reset">Clear Order</button>
    </form>
</body>
</html>
